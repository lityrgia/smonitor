name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-build:
    name: Windows x64 build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build GUI and driver
        shell: pwsh
        run: ./build-windows.ps1 -Configuration Release

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scall-monitor-windows-x64
          path: |
            dist/smonitor.exe
            dist/swatcher.sys
          if-no-files-found: error
          retention-days: 14
